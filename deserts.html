<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Desserts</title>
    <link rel="stylesheet" href="css/deserts.css">
    <link rel="icon" href="/img/favicon.png" type="image/png">
</head>

<body>

    <div class="container">

    <a href="index.html" class="header-link">
        <header>
            <h1>Rachel's Recipes</h1>
        </header>
    </a>

    <img src="img/picture8.png" class="floating-img img1">
    <img src="img/cake.png" class="floating-img img2">
    <img src="img/picture6.png" class="floating-img img3">
    <img src="img/picture4.png" class="floating-img img4">


        <div class="layout">

            <!-- left sidebar -->
            <aside class="sidebar">
                <h3>Navigation</h3>
                <ul>
                    <li><a href="home.html">✧Our Story</a></li>
                    <li><a href="appetizers.html">✧Appetizers</a></li>
                    <li><a href="maindishes.html">✧Main Dishes</a></li>
                    <li><a href="deserts.html">✧Desserts</a></li>
                </ul>
            </aside>

            <!-- main content -->
            <main class="content">
                <div>
                    <section class="appetizers">
                        <h2>Desserts</h2>
                    </section>
                </div>


                <!-- recipe cards -->

                <!-- NON FLIP CARDS -->
                <section class="recipecards">

                    <div class="card" id="buttercookies">
                        <img src="img/buttercookies.png" alt="Butter Cookies">
                    </div>

                    <div class="card" id="applefriedpies">
                        <img src="img/applefriedpies.png" alt="Apple Fried Pies">
                    </div>

                    <div class="card" id="reesessquares">
                        <img src="img/reesessquares.png" alt="Reeses Squares">
                    </div>

                    <div class="card" id="pecanpie">
                        <img src="img/pecanpie.png" alt="Pecan Pie">
                    </div>

                    <div class="card" id="prunecake">
                        <img src="img/prunecake.png" alt="Prune Cake">
                    </div>

                    <!-- FLIPPING CARDS -->

                    <!-- coffee cake -->
                    <div class="card" id="coffeecake">
                        <input type="checkbox" id="card1">
                        <label for="card1" class="card-inner">
                            <div class="card-front">
                                <img src="img/coffeecake1.png" alt="coffee cake front">
                            </div>
                            <div class="card-back">
                                <img src="img/coffeecake2.png" alt="coffee cake back">
                            </div>
                        </label>
                    </div>
                    <!-- southern banana pudding -->
                    <div class="card" id="bananapudding">
                        <input type="checkbox" id="card2">
                        <label for="card2" class="card-inner">
                            <div class="card-front">
                                <img src="img/bananapudding1.png" alt="banana pudding front">
                            </div>
                            <div class="card-back">
                                <img src="img/bananapudding2.png" alt="banana pudding back">
                            </div>
                        </label>
                    </div>
                    <!-- peaches perfect -->
                    <div class="card" id="peaches">
                        <input type="checkbox" id="card3">
                        <label for="card3" class="card-inner">
                            <div class="card-front">
                                <img src="img/peachesperfect1.png" alt="peaches perfect front">
                            </div>

                            <div class="card-back">
                                <img src="img/peachesperfect2.png" alt="peaches perfect back">
                            </div>
                        </label>
                    </div>
                </section>
            </main>

            <!-- right sidebar -->
            <aside class="sidebar right">
                <ul>
                    <li><a href="#buttercookies">✧Butter Cookies</a></li>
                    <li><a href="#applefriedpies">✧Apple Fried Pies</a></li>
                    <li><a href="#reesessquares">✧Reese's Squares</a></li>
                    <li><a href="#pecanpie">✧Pecan Pie</a></li>
                    <li><a href="#prunecake">✧Prune Cake</a></li>
                    <li><a href="#coffeecake">✧Coffee Cake</a></li>
                    <li><a href="#bananapudding">✧Banana Pudding</a></li>
                    <li><a href="#peaches">✧Peaches Perfect</a></li>
                </ul>
            </aside>

        </div>

        <footer>
            <p>for my Nonnie <3 </p>
        </footer>

    </div>

</body>

</html>
